spring:
    application:
        name: order-service
    config:
        #    import: optional:configserver:http://localhost:8888
        import: configserver:http://localhost:8888

feign:
    circuitbreaker:
        enabled: true

resilience4j:
    circuitbreaker:
        instances:
            productClient: # Đặt tên khớp với tên FeignClient của bạn
                slidingWindowSize: 5
                failureRateThreshold: 50
                waitDurationInOpenState: 5s
    timelimiter:
        instances:
            productClient:
                timeoutDuration: 2s # Nếu lấy giá sản phẩm quá 2 giây không xong -> Hủy ngay lập tức